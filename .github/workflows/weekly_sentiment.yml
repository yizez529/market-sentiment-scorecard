name: Weekly Market Sentiment Scorecard

on:
  # 每周一北京时间 10:00 = UTC 02:00
  # 覆盖上周全部 5 个交易日的市场数据
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'full'
        type: choice
        options:
          - smoke-test-only
          - full

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check all scripts importable
        run: |
          cd scripts
          python -c "
          import fetch_indicators, calculate_score, claude_analysis, generate_html, feishu_card
          import run_daily, sectors_config, fetch_sectors, score_sectors, sectors_pe_benchmarks
          import fetch_fundamentals, fundamentals_temperature
          import portfolio_config, divergence_detector, anomaly_check
          print('✅ All scripts import OK')
          "

      - name: Check required env vars present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "❌ ANTHROPIC_API_KEY missing"; exit 1; fi
          if [ -z "$FEISHU_WEBHOOK" ]; then echo "❌ FEISHU_WEBHOOK missing"; exit 1; fi
          if [ -z "$FRED_API_KEY" ]; then echo "⚠️  FRED_API_KEY missing"; fi
          if [ -z "$FMP_API_KEY" ]; then echo "⚠️  FMP_API_KEY missing"; fi
          echo "✅ Required env vars present"

  scan:
    needs: smoke-test
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run weekly scorecard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/market-sentiment-scorecard/
        run: python scripts/run_daily.py

      - name: Commit data + docs back to repo
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data/ docs/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore(weekly): update scorecard $(date -u +%Y-%m-%d)"
            git push
          fi

  deploy-pages:
    needs: scan
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'full') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
